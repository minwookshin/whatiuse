name: Browser matrix

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Generate strict Linux visual baselines for review
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: browser-matrix
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac # v1.62.1-noble, linux/amd64
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_baselines }}
        env:
          HOME: /root
        run: npm run test:browsers
      - name: Generate Linux visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        shell: bash
        run: |
          npm run test:stories:visual:update
          npm run test:visual:catalog:update
          npx playwright test tests/browser/visual-regression.spec.ts --project=chromium --update-snapshots
          set -euo pipefail
          find \
            tests/storybook/visual-regression.spec.ts-snapshots \
            tests/storybook/analytics-visual.spec.ts-snapshots \
            tests/storybook/product-patterns-visual.spec.ts-snapshots \
            tests/browser/full-catalog-visual.spec.ts-snapshots \
            tests/browser/visual-regression.spec.ts-snapshots \
            -type f -name '*-linux.png' -print0 \
            | tar --null --files-from=- -czf whatiuse-linux-visual-baselines.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        with:
          name: whatiuse-linux-visual-baselines
          path: whatiuse-linux-visual-baselines.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-browser-matrix
          path: |
            playwright-report
            test-results
