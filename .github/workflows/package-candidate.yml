name: Package candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, for example 0.1.0-rc.1
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Verify requested version and publication lock
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e "const pkg = JSON.parse(require('fs').readFileSync('package.json')); if (pkg.version !== process.env.EXPECTED_VERSION || pkg.private !== true) process.exit(1)"
      - run: npm run build:registry
      - run: npm run test:registry
      - run: npm run build:package
      - run: npm run check:package
      - run: npm run test:package
      - run: npm run test:dogfood
      - run: npm audit --audit-level=high
      - run: npm run check:security
      - name: Assemble exact package candidate
        env:
          WHATIUSE_PACKAGE_CANDIDATE_DIR: ${{ runner.temp }}/whatiuse-package-candidate
        run: npm run assemble:package-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whatiuse-package-${{ inputs.version }}
          path: ${{ runner.temp }}/whatiuse-package-candidate
          if-no-files-found: error

  attest:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: whatiuse-package-${{ inputs.version }}
          path: ${{ runner.temp }}/whatiuse-package-candidate
      - name: Verify exact attestation subject
        id: subject
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/whatiuse-package-candidate
        run: |
          set -euo pipefail
          mapfile -d '' subjects < <(find "$CANDIDATE_DIR" -maxdepth 1 -type f -name '*.tgz' -print0)
          test "${#subjects[@]}" -eq 1
          (cd "$CANDIDATE_DIR" && sha256sum --check SHA256SUMS)
          printf 'subject_path=%s\n' "${subjects[0]}" >> "$GITHUB_OUTPUT"
      - name: Attest exact package tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subject.outputs.subject_path }}

  publication-remains-manual:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "Candidate verified and attested. This workflow does not publish to npm or create a release."
