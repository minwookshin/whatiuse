name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, for example 0.1.0-rc.1
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify:rc:core
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e "const actual = JSON.parse(require('fs').readFileSync('package.json')).version; if (actual !== process.env.EXPECTED_VERSION) { console.error(actual); process.exit(1); }"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whatiuse-${{ inputs.version }}
          path: |
            dist
            public/r
            performance-report.json
          if-no-files-found: error

  publication-remains-manual:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: echo "Verification passed. Tagging, GitHub Release creation, and package publication remain explicit maintainer actions."
